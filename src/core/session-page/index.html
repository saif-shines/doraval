<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sessions · doraval</title>
    <script>
      (function () {
        var saved = localStorage.getItem("doraval-theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-mono.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        color-scheme: light;
        --bg: oklch(1 0 0);
        --fg: oklch(0.145 0 0);
        --muted: oklch(0.965 0 0);
        --muted-fg: oklch(0.54 0 0);
        --border: oklch(0.88 0.006 260 / 0.72);
        --accent: oklch(58% 0.2 256);
        --code: oklch(0.99 0 0);
        --add: oklch(0.42 0.12 150);
        --remove: oklch(0.5 0.18 22);
        --radius: 0.25rem;
        --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --body: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: oklch(0.085 0 0);
        --fg: oklch(0.96 0 0);
        --muted: oklch(0.16 0 0);
        --muted-fg: oklch(0.68 0 0);
        --border: oklch(0.24 0 0 / 0.8);
        --code: oklch(0.12 0 0);
        --add: oklch(0.78 0.14 150);
        --remove: oklch(0.75 0.16 22);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.55 var(--body);
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      ::selection { background: oklch(58% 0.2 256 / 0.25); }
      code {
        font-family: var(--mono);
        font-size: 0.85em;
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.05em 0.3em;
      }

      .topbar {
        display: flex;
        gap: 1.25rem;
        align-items: flex-end;
        justify-content: space-between;
        padding: 1.25rem 1.25rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        margin: 0;
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      .eyebrow {
        margin: 0 0 0.2rem;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .lede {
        margin: 0.35rem 0 0;
        max-width: 46rem;
        color: var(--muted-fg);
        font-size: 0.95rem;
      }
      form { display: flex; gap: 0.5rem; align-items: center; }
      .paper {
        width: 16rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.4rem 0.55rem;
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .key, .ghost {
        border-radius: var(--radius);
        padding: 0.4rem 0.7rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        transition: transform 160ms var(--ease-out);
      }
      .key {
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent);
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted-fg);
      }
      .ghost.on { color: var(--fg); border-color: var(--accent); }
      .check {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        color: var(--muted-fg);
        white-space: nowrap;
      }
      .check input { accent-color: var(--accent); }
      .icon {
        width: 0.95rem;
        height: 0.95rem;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .field { position: relative; display: flex; align-items: center; }
      .field > .icon {
        position: absolute;
        left: 0.45rem;
        color: var(--muted-fg);
        pointer-events: none;
      }
      .paper.with-icon { padding-left: 1.75rem; }
      .key { display: inline-flex; align-items: center; gap: 0.35rem; }
      .path-line, .fact-bit {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        max-width: 100%;
        min-width: 0;
      }
      .path-line .path { margin-top: 0; }
      .kicker .icon { width: 0.8rem; height: 0.8rem; }
      .now .icon { fill: currentColor; stroke: none; }
      .key:active, .ghost:active, .bay:active { transform: scale(0.97); }

      .layout {
        display: grid;
        grid-template-columns: 18rem 1fr;
        height: calc(100vh - 7.2rem);
      }
      aside, main { min-height: 0; overflow: auto; }
      aside { border-right: 1px solid var(--border); padding: 0.5rem 0; }
      main { padding: 1.25rem 1.5rem 3rem; }

      .bay {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.65rem 0.9rem;
        background: transparent;
        border: 0;
        border-left: 2px solid transparent;
        border-radius: 0;
      }
      .bay.on { background: var(--muted); border-left-color: var(--accent); }
      .bay b {
        display: block;
        font-family: var(--display);
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
      }
      .path {
        display: inline-block;
        max-width: 100%;
        margin-top: 0.25rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted-fg);
      }
      .meta { margin-top: 0.25rem; color: var(--muted-fg); font-size: 0.78rem; }
      .meta-facts { display: flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; }
      .now { color: var(--accent); }

      .meters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 1.25rem;
      }
      .meter {
        min-width: 5.5rem;
        padding: 0.45rem 0.65rem;
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .meter strong {
        display: block;
        font-family: var(--display);
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }
      .meter span {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted-fg);
      }

      .turn-label {
        margin: 1.4rem 0 0.4rem;
        font-family: var(--display);
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: -0.015em;
      }
      .plate {
        margin: 0 0 0.8rem;
        padding: 0;
        background: transparent;
        border: 0;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0 0 0.25rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .chip {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 99px;
        background: var(--accent);
      }
      .chip.message { background: var(--add); }
      .chip.reply { background: var(--accent); }
      .chip.tool { background: var(--muted-fg); }
      .chip.err { background: var(--remove); }
      .body {
        margin: 0;
        max-width: 72ch;
        white-space: pre-wrap;
      }
      .tool-row {
        display: grid;
        grid-template-columns: 9rem minmax(0, 1fr) auto;
        gap: 0.6rem;
        align-items: baseline;
        padding: 0.28rem 0;
        border-top: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 0.78rem;
      }
      .tool-name { color: var(--fg); }
      .tool-path {
        margin: 0;
        color: var(--muted-fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fail { color: var(--remove); }
      .empty { color: var(--muted-fg); }

      .fact {
        display: grid;
        grid-template-columns: 9.5rem minmax(0, 1fr);
        gap: 0.35rem 0.75rem;
        margin: 0;
      }
      .fact dt {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted-fg);
      }
      .fact dd { margin: 0; min-width: 0; }
      .fact .path { margin-top: 0; }
      .fact .ghost, .sub .ghost {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 0.75rem;
        align-items: baseline;
        width: 100%;
        text-align: left;
        padding: 0.35rem 0;
        background: transparent;
        border: 0;
        border-top: 1px solid var(--border);
        border-radius: 0;
        font-family: var(--mono);
        font-size: 0.78rem;
      }
      .file-row > .path { min-width: 0; margin-top: 0; }
      .add { color: var(--add); }
      .del { color: var(--remove); }
      .dump {
        margin: 0.25rem 0 0.55rem;
        padding: 0.55rem 0.65rem;
        max-height: 20rem;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: var(--mono);
        font-size: 0.75rem;
      }
      .dump[hidden] { display: none; }
      .tool-side {
        display: flex;
        gap: 0.55rem;
        justify-content: flex-end;
        color: var(--muted-fg);
      }
      .tool-command, .tool-extra { grid-column: 1 / -1; }
      .tool-command {
        color: var(--muted-fg);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ghost.out { padding: 0.15rem 0.45rem; font-size: 0.72rem; }
      .tool-extra .meta { margin: 0.35rem 0 0; }
      .sub {
        padding: 0.45rem 0 0.15rem;
        border-top: 1px solid var(--border);
      }
      .sub .body { margin-top: 0.3rem; }

      @media (hover: hover) and (pointer: fine) {
        .bay:hover, .file-row:hover { background: var(--muted); }
        .ghost:hover { border-color: var(--accent); }
      }
      @media (prefers-reduced-motion: reduce) {
        .key, .ghost, .bay { transition: none; }
        .key:active, .ghost:active, .bay:active { transform: none; }
      }
      @media (max-width: 800px) {
        .topbar { flex-wrap: wrap; align-items: stretch; }
        form { width: 100%; }
        .paper { flex: 1; width: auto; min-width: 0; }
        .layout { grid-template-columns: 1fr; height: auto; }
        aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
        .fact { grid-template-columns: 1fr; gap: 0.1rem 0; }
        .fact dd { margin-bottom: 0.45rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Sessions</p>
        <h1 class="brand">Grok sessions</h1>
        <p class="lede">This page lists sessions in <code>~/.grok</code>. Pick one to read the turns. Nothing is uploaded.</p>
      </div>
      <form id="pick">
        <label class="field">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <input id="root" class="paper with-icon" type="text" name="root" value="~/.grok" aria-label="Grok home" />
        </label>
        <button class="key" type="submit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Load
        </button>
        <label class="check">
          <input id="show-hidden" type="checkbox" />
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Include subagents and temp folders
        </label>
      </form>
    </header>
    <div class="layout">
      <aside id="list"></aside>
      <main id="detail"><p class="empty">Pick a session.</p></main>
    </div>
    <script>
      const listEl = document.querySelector("#list");
      const detailEl = document.querySelector("#detail");
      const rootEl = document.querySelector("#root");
      const hiddenBtn = document.querySelector("#show-hidden");
      let rows = [];
      let selected = location.hash.replace(/^#/, "");
      let showHidden = false;

      function text(tag, value, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = value ?? "";
        return node;
      }

      const NS = "http://www.w3.org/2000/svg";
      const GLYPH = {
        folder: [["path", { d: "M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" }]],
        user: [["path", { d: "M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" }], ["circle", { cx: "12", cy: "7", r: "4" }]],
        bot: [["path", { d: "M12 8V4H8" }], ["rect", { width: "16", height: "12", x: "4", y: "8", rx: "2" }], ["path", { d: "M2 14h2" }], ["path", { d: "M20 14h2" }], ["path", { d: "M15 13v2" }], ["path", { d: "M9 13v2" }]],
        wrench: [["path", { d: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" }]],
        file: [["path", { d: "M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" }], ["path", { d: "M14 2v4a2 2 0 0 0 2 2h4" }]],
        users: [["path", { d: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" }], ["circle", { cx: "9", cy: "7", r: "4" }], ["path", { d: "M22 21v-2a4 4 0 0 0-3-3.87" }], ["path", { d: "M16 3.13a4 4 0 0 1 0 7.75" }]],
        git: [["circle", { cx: "12", cy: "18", r: "3" }], ["circle", { cx: "6", cy: "6", r: "3" }], ["circle", { cx: "18", cy: "6", r: "3" }], ["path", { d: "M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9" }], ["path", { d: "M12 12v3" }]],
        coin: [["circle", { cx: "12", cy: "12", r: "8" }], ["path", { d: "M12 8v8" }], ["path", { d: "M9.5 9.5c.5-.7 1.4-1 2.5-1 1.5 0 2.5.8 2.5 2s-1 2-2.5 2-2.5.8-2.5 2 1 2 2.5 2c1.1 0 2-.3 2.5-1" }]],
        scroll: [["path", { d: "M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4" }], ["path", { d: "M19 17V5a2 2 0 0 0-2-2H4" }]],
        spark: [["path", { d: "M9.9 10.1 12 3l2.1 7.1L21 12l-6.9 1.9L12 21l-2.1-7.1L3 12z" }]],
        shield: [["path", { d: "M20 13c0 5-3.5 7.5-7.7 8.9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.1 1.1 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z" }]],
        alert: [["path", { d: "m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3" }], ["path", { d: "M12 9v4" }], ["path", { d: "M12 17h.01" }]],
        dot: [["circle", { cx: "12", cy: "12", r: "5" }]],
      };

      function icon(name) {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        svg.classList.add("icon");
        for (const [tag, attrs] of GLYPH[name]) {
          const el = document.createElementNS(NS, tag);
          for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
          svg.append(el);
        }
        return svg;
      }

      function iconFor(kind, label) {
        if (kind === "message") return "user";
        if (kind === "reply") return "bot";
        if (kind === "tool" || kind === "err") return "wrench";
        const name = String(label || "").toLowerCase();
        if (name.startsWith("lineage")) return "git";
        if (name.startsWith("cost")) return "coin";
        if (name.startsWith("changed")) return "file";
        if (name.startsWith("subagent")) return "users";
        if (name.startsWith("recap")) return "scroll";
        if (name.startsWith("skill")) return "spark";
        if (name.startsWith("permission")) return "shield";
        if (name.startsWith("think")) return "spark";
        return "file";
      }

      function renderList() {
        listEl.replaceChildren();
        const visible = rows.filter((row) => showHidden || !row.hidden);
        if (visible.length === 0) {
          listEl.append(text("p", "No sessions in that folder.", "empty"));
          return;
        }
        for (const row of visible) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "bay" + (row.id === selected ? " on" : "");
          button.append(text("b", row.title));
          if (row.folder) {
            const path = text("span", row.folder, "path");
            path.title = row.folder;
            const line = document.createElement("span");
            line.className = "path-line";
            line.append(icon("folder"), path);
            button.append(line);
          }
          const meta = document.createElement("div");
          meta.className = "meta";
          const who = [row.model, row.branch].filter(Boolean).join(" · ");
          if (who) meta.append(text("div", who));
          const facts = document.createElement("div");
          facts.className = "meta-facts";
          if (row.contextPct != null) facts.append(text("span", row.contextPct + "% context"));
          if (row.errors) {
            const failed = document.createElement("span");
            failed.className = "fact-bit fail";
            failed.append(icon("alert"), document.createTextNode(row.errors + " failed"));
            facts.append(failed);
          }
          if (row.turns != null) facts.append(text("span", row.turns + " turns"));
          if (row.live) {
            const live = document.createElement("span");
            live.className = "fact-bit now";
            live.append(icon("dot"), document.createTextNode("now"));
            facts.append(live);
          }
          if (facts.childNodes.length) meta.append(facts);
          button.append(meta);
          button.addEventListener("click", () => openSession(row.id));
          listEl.append(button);
        }
      }

      function meter(value, caption) {
        const cell = document.createElement("div");
        cell.className = "meter";
        cell.append(text("strong", value), text("span", caption));
        return cell;
      }

      function metersFor(row, turns) {
        const meters = document.createElement("div");
        meters.className = "meters";
        const turnCount = turns == null ? row.turns : turns;
        meters.append(
          meter(turnCount == null ? "—" : String(turnCount), "Turns"),
          meter(row.contextPct == null ? "—" : row.contextPct + "%", "Context"),
          meter(row.errors == null ? "—" : String(row.errors), "Errors"),
          meter(row.model || "—", "Model"),
        );
        return meters;
      }

      function kicker(label, kind) {
        const node = document.createElement("p");
        node.className = "kicker";
        node.append(icon(iconFor(kind, label)), document.createTextNode(" " + label));
        return node;
      }

      function plate(kind, label, body, path) {
        const card = document.createElement("article");
        card.className = "plate";
        card.append(kicker(label, kind));
        if (body) card.append(text("p", body, "body"));
        if (path) {
          const line = text("p", path, "tool-path");
          line.title = path;
          card.append(line);
        }
        return card;
      }

      function block(label) {
        const card = document.createElement("article");
        card.className = "plate";
        card.append(kicker(label, ""));
        return card;
      }

      function formatDuration(ms) {
        if (typeof ms !== "number" || !Number.isFinite(ms)) return "";
        if (ms < 1000) return ms + " ms";
        const seconds = ms / 1000;
        if (seconds < 60) return (Math.round(seconds * 10) / 10) + " s";
        let minutes = Math.floor(seconds / 60);
        let rem = Math.round(seconds - minutes * 60);
        if (rem === 60) {
          minutes += 1;
          rem = 0;
        }
        if (rem === 0) return minutes + " m";
        return minutes + " m " + rem + " s";
      }

      function formatCost(n) {
        const sign = n < 0 ? "-" : "";
        return sign + "$" + Math.abs(n);
      }

      function sessionButton(id) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "ghost";
        button.textContent = id;
        button.addEventListener("click", () => openSession(id));
        return button;
      }

      function lineageBlock(facts) {
        const pick = (key) => (typeof facts[key] === "string" ? facts[key] : "");
        const rows = [];
        const addText = (label, value, mono) => {
          if (!value) return;
          const dd = document.createElement("dd");
          const node = text("span", value, mono ? "path" : "");
          if (mono) node.title = value;
          dd.append(node);
          rows.push(text("dt", label), dd);
        };
        addText("Log path", pick("logPath"), true);
        const parentId = pick("parentSessionId");
        if (parentId) {
          const dd = document.createElement("dd");
          dd.append(sessionButton(parentId));
          rows.push(text("dt", "Parent session"), dd);
        }
        addText("Head commit", pick("headCommit"), true);
        if (rows.length === 0) return null;
        const card = block("Lineage");
        const list = document.createElement("dl");
        list.className = "fact";
        list.append(...rows);
        card.append(list);
        return card;
      }

      function fileOf(entry) {
        if (!entry || typeof entry !== "object" || typeof entry.path !== "string" || !entry.path) return null;
        const file = { path: entry.path };
        if (typeof entry.added === "number" && Number.isFinite(entry.added)) file.added = entry.added;
        if (typeof entry.removed === "number" && Number.isFinite(entry.removed)) file.removed = entry.removed;
        if (typeof entry.diff === "string" && entry.diff) file.diff = entry.diff;
        return file;
      }

      function collectFiles(facts) {
        const rollup = Array.isArray(facts.files) ? facts.files : [];
        const ordered = [];
        const byPath = new Map();
        for (const entry of rollup) {
          const file = fileOf(entry);
          if (!file) continue;
          const prev = byPath.get(file.path);
          if (!prev) {
            byPath.set(file.path, file);
            ordered.push(file);
            continue;
          }
          if (prev.added == null && file.added != null) prev.added = file.added;
          if (prev.removed == null && file.removed != null) prev.removed = file.removed;
          if (!prev.diff && file.diff) prev.diff = file.diff;
        }
        return ordered;
      }

      function filesBlock(files) {
        const card = block("Changed files");
        for (const file of files) {
          const path = text("span", file.path, "path");
          path.title = file.path;
          const added = text("span", file.added == null ? "" : "+" + file.added, "add");
          const removed = text("span", file.removed == null ? "" : "−" + file.removed, "del");
          if (!file.diff) {
            const row = document.createElement("div");
            row.className = "file-row";
            row.append(path, added, removed);
            card.append(row);
            continue;
          }
          const button = document.createElement("button");
          button.type = "button";
          button.className = "file-row";
          button.setAttribute("aria-expanded", "false");
          button.append(path, added, removed);
          const pre = text("pre", file.diff, "dump");
          pre.hidden = true;
          button.addEventListener("click", () => {
            pre.hidden = !pre.hidden;
            button.setAttribute("aria-expanded", pre.hidden ? "false" : "true");
          });
          const wrap = document.createElement("div");
          wrap.append(button, pre);
          card.append(wrap);
        }
        return card;
      }

      function subagentOf(raw) {
        if (!raw || typeof raw !== "object") return null;
        const id = typeof raw.id === "string" ? raw.id : "";
        const description = typeof raw.description === "string" ? raw.description : "";
        const model = typeof raw.model === "string" ? raw.model : "";
        const status = typeof raw.status === "string" ? raw.status : "";
        let duration = "";
        if (typeof raw.durationMs === "number" && Number.isFinite(raw.durationMs)) duration = formatDuration(raw.durationMs);
        else if (typeof raw.duration === "number" && Number.isFinite(raw.duration)) duration = formatDuration(raw.duration);
        else if (typeof raw.duration === "string") duration = raw.duration;
        const calls = typeof raw.toolCalls === "number" && Number.isFinite(raw.toolCalls)
          ? raw.toolCalls
          : typeof raw.toolCallCount === "number" && Number.isFinite(raw.toolCallCount)
            ? raw.toolCallCount
            : null;
        if (!id && !description && !model && !status && !duration && calls == null) return null;
        return { id, description, model, status, duration, calls };
      }

      function subagentBlock(facts) {
        if (!Array.isArray(facts.subagents)) return null;
        const rows = facts.subagents.map(subagentOf).filter(Boolean);
        if (rows.length === 0) return null;
        const card = block("Subagents");
        for (const row of rows) {
          const item = document.createElement("div");
          item.className = "sub";
          if (row.id) item.append(sessionButton(row.id));
          if (row.description) item.append(text("p", row.description, "body"));
          const bits = [row.model, row.status, row.duration];
          if (row.calls != null) bits.push(row.calls + " tool calls");
          const meta = bits.filter(Boolean).join(" · ");
          if (meta) item.append(text("p", meta, "meta"));
          card.append(item);
        }
        return card;
      }

      function skillNames(facts, turns) {
        const names = [];
        const add = (value) => {
          const name = typeof value === "string"
            ? value
            : value && typeof value === "object" && typeof value.name === "string"
              ? value.name
              : "";
          if (!name || names.includes(name)) return;
          names.push(name);
        };
        if (Array.isArray(facts.skills)) for (const name of facts.skills) add(name);
        for (const turn of turns) {
          if (!Array.isArray(turn.skills)) continue;
          for (const name of turn.skills) add(name);
        }
        return names;
      }

      function permissionBlock(facts) {
        if (!Array.isArray(facts.permissions) || facts.permissions.length === 0) return null;
        const rows = [];
        for (const item of facts.permissions) {
          if (!item || typeof item !== "object") continue;
          const tool = typeof item.tool === "string" ? item.tool : "";
          const decision = typeof item.decision === "string" ? item.decision : "";
          if (!tool && !decision) continue;
          rows.push({ tool, decision });
        }
        if (rows.length === 0) return null;
        const card = block("Permissions");
        for (const row of rows) {
          const line = document.createElement("div");
          line.className = "tool-row";
          line.append(text("span", row.tool, "tool-name"));
          line.append(text("span", row.decision, "tool-path"));
          card.append(line);
        }
        return card;
      }

      function renderFacts(parent, facts, turns) {
        const data = facts && typeof facts === "object" ? facts : {};
        const lineage = lineageBlock(data);
        if (lineage) parent.append(lineage);
        if (typeof data.costUsd === "number" && Number.isFinite(data.costUsd)) {
          parent.append(plate("", "Cost", formatCost(data.costUsd)));
        }
        const files = collectFiles(data);
        if (files.length) parent.append(filesBlock(files));
        const subs = subagentBlock(data);
        if (subs) parent.append(subs);
        if (typeof data.compactionCount === "number" && Number.isFinite(data.compactionCount) && data.compactionCount > 0) {
          parent.append(text("p", "Compactions: " + data.compactionCount, "meta"));
        }
        if (Array.isArray(data.recaps)) {
          for (const recap of data.recaps) {
            if (typeof recap === "string" && recap.trim()) parent.append(plate("", "Recap", recap));
          }
        }
        const skills = skillNames(data, turns);
        if (skills.length) parent.append(plate("", "Skills", skills.join(", ")));
        const perms = permissionBlock(data);
        if (perms) parent.append(perms);
      }

      function appendTool(card, tool) {
        const line = document.createElement("div");
        line.className = "tool-row" + (tool.failed ? " fail" : "");
        line.append(text("span", tool.name, "tool-name"));
        const command = typeof tool.command === "string" ? tool.command : "";
        const pathValue = typeof tool.path === "string" ? tool.path : "";
        const showCommand = command !== "" && command !== tool.name;
        const mid = pathValue || (showCommand ? command : "");
        const path = text("span", mid, "tool-path");
        path.title = mid;
        line.append(path);
        const side = document.createElement("span");
        side.className = "tool-side";
        if (typeof tool.durationMs === "number" && Number.isFinite(tool.durationMs)) {
          side.append(text("span", formatDuration(tool.durationMs)));
        }
        if (tool.failed) side.append(text("span", "failed", "fail"));
        line.append(side);
        if (showCommand && pathValue && pathValue !== command) {
          const cmd = text("span", command, "tool-command");
          cmd.title = command;
          line.append(cmd);
        }
        if (typeof tool.output === "string" && tool.output !== "") {
          const extra = document.createElement("div");
          extra.className = "tool-extra";
          const pre = text("pre", tool.output, "dump");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "ghost out";
          button.textContent = "Output";
          button.setAttribute("aria-expanded", "true");
          button.addEventListener("click", () => {
            pre.hidden = !pre.hidden;
            button.setAttribute("aria-expanded", pre.hidden ? "false" : "true");
          });
          extra.append(button);
          if (tool.outputTruncated === true) extra.append(text("p", "Output cut at 2000 characters.", "meta"));
          extra.append(pre);
          line.append(extra);
        }
        card.append(line);
      }

      async function loadList() {
        listEl.replaceChildren(text("p", "Reading summaries.", "empty"));
        const res = await fetch("/api/sessions?root=" + encodeURIComponent(rootEl.value));
        const body = await res.json();
        if (!res.ok) {
          listEl.replaceChildren(text("p", body.error || "Could not read that folder.", "empty"));
          return;
        }
        rows = body.rows;
        renderList();
        if (selected) openSession(selected);
      }

      async function openSession(id) {
        selected = id;
        history.replaceState(null, "", "#" + id);
        renderList();
        const on = listEl.querySelector(".bay.on");
        if (on) on.scrollIntoView({ block: "nearest" });
        const known = rows.find((row) => row.id === id);
        detailEl.replaceChildren();
        if (known) detailEl.append(metersFor(known));
        detailEl.append(text("p", "Reading this session.", "empty"));
        const res = await fetch("/api/session?root=" + encodeURIComponent(rootEl.value) + "&id=" + encodeURIComponent(id));
        const body = await res.json();
        if (!res.ok) {
          detailEl.replaceChildren(text("p", body.error || "Session not found.", "empty"));
          return;
        }
        detailEl.replaceChildren();
        const closed = body.turns.filter((turn) => turn.closed).length;
        detailEl.append(metersFor(body.row, closed));
        renderFacts(detailEl, body.facts, body.turns);
        for (const turn of body.turns) {
          detailEl.append(text("p", "Turn " + turn.n + (turn.closed ? "" : " · open"), "turn-label"));
          detailEl.append(plate("message", "You", turn.prompt || "(no prompt)"));
          if (typeof turn.thinking === "string" && turn.thinking.trim()) {
            detailEl.append(plate("tool", "Thinking", turn.thinking));
          }
          if (turn.reply) detailEl.append(plate("reply", "Assistant", turn.reply));
          if (turn.tools.length === 0) continue;
          const failed = turn.tools.some((tool) => tool.failed);
          const card = plate(failed ? "err" : "tool", "Tools");
          for (const tool of turn.tools) appendTool(card, tool);
          detailEl.append(card);
        }
      }

      document.querySelector("#pick").addEventListener("submit", (event) => {
        event.preventDefault();
        selected = "";
        history.replaceState(null, "", location.pathname);
        loadList();
      });
      hiddenBtn.addEventListener("change", () => {
        showHidden = hiddenBtn.checked;
        renderList();
      });
      loadList();
    </script>
  </body>
</html>
